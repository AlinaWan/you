name: Render README

on:
  push:
    branches:
      - main
    paths:
      - "readme/**"
      - ".github/workflows/build-readme.yml"
      - ".github/scripts/renderReadme.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-readme:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.2

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Capture README
        run: node .github/scripts/renderReadme.js

      - name: Commit README images
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Render and update readme"
          file_pattern: "images/readme/part-*"