<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>you</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'><style>@media (prefers-color-scheme:light){svg{stroke:black}}</style><line x1='16' y1='13' x2='16' y2='21'/><line x1='8' y1='13' x2='8' y2='21'/><line x1='12' y1='15' x2='12' y2='23'/><path d='M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25'/></svg>">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <canvas id="canvas"></canvas>

    <div id="wordCursor" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
                 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
                 C13.09 3.81 14.76 3 16.5 3
                 C19.58 3 22 5.42 22 8.5
                 c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>
    </div>

    <div id="searchUI">

        <div id="searchBox">

            <input id="searchInput"
                   type="text"
                   autocomplete="off"
                   autocorrect="off"
                   autocapitalize="off"
                   spellcheck="false"
                   placeholder="Search..."
                   aria-label="Search words">

            <button id="clearSearchButton"
                    type="button"
                    aria-label="Clear search">
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     aria-hidden="true">
                    <path d="M6 6l12 12" />
                    <path d="M18 6L6 18" />
                </svg>
            </button>

            <div id="resultsWrapper">

                <div id="results">

                    <div id="resultsScroll"></div>

                </div>

            </div>

        </div>

    </div>

    <button id="muteButton" type="button" aria-label="Unmute audio">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
    </button>

    <a id="supportButton"
       href="https://github.com/AlinaWan/you/issues/new?template=donate.yml"
       aria-label="Support the project">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">
            <path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762" />
        </svg>
    </a>

    <a id="submitButton"
       href="https://github.com/AlinaWan/you/issues/new?template=add-word.yml"
       aria-label="Submit a word">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24"
             height="24"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">
            <path d="m14.479 19.374-.971.939a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5a5.2 5.2 0 0 1-.219 1.49" />
            <path d="M15 15h6" />
            <path d="M18 12v6" />
        </svg>
    </a>

    <div id="hint">
        <span class="desktopHint">WASD / arrow keys to move</span>
        <span class="mobileHint">1 finger to explore · 2 fingers to pan</span>
    </div>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
