name: Add Name Attributions (Donate)
description: Donate USDT to add name attributions to words.
title: "[DONATION] Add name attributions"
labels:
  - donation
  - pending
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Donations support the **you** project and give me motivation to continue developing and maintaining it. Name attributions are a thank-you perk for donors.
        >
        > You can use a name attribution to associate someone with a word that reminds you of them, a memory, or something left unsaid.
        >
        > You can donate by tipping **USDT** on the **Solana** network to the address:
        > `QUvS5qzbvpvYisrVawiAdRF768JDH5o8jpWM3hUbz89`
        >
        > Donation Tiers
        >
        > * $5 USDT — up to 1 name assignment
        > * $15 USDT — up to 5 name assignments
        > * $25 USDT — up to 10 name assignments, with an optional custom color for each name
        >
        > 1. Each name appears in the details section of the word's search result on the website.
        > 2. You may assign multiple names to the same word or distribute your assignments across different words.
        > 3. Please submit no more name assignments than your donation tier allows.
        > 4. **Please send USDT on Solana only. Do not send USDT using another network.**
        >
        > Donations are manually reviewed and approved. Submitting this Issue does not guarantee that your requested names will be added.

  - type: input
    id: transaction
    attributes:
      label: Transaction Signature
      description: The full Solana transaction signature for your USDT donation.
      placeholder: e.g., 5Vz9...
    validations:
      required: true

  - type: input
    id: amount
    attributes:
      label: Amount (USDT)
      description: The amount of USDT sent.
      placeholder: "15"
    validations:
      required: true

  - type: textarea
    id: names
    attributes:
      label: Names & Word Assignments
      description: |
        Enter one name per line using the format: `Name | Word ID | Color (Hexadecimal)`.
      placeholder: |
        Alice | 632ebce5300e |
        Bob | 632ebce5300e |
        Charlie | 5fecfec76cb6 | #ff5733
        Diana | 5fecfec76cb6 |
        Eve | 5fecfec76cb6 |
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > 1. First names are allowed, but do not include usernames, last names, or any other details that could be used to identify or contact a person.
        > 2. The Word ID is included in the URL when you copy the link to a word. You can also view `words.txt` directly for the entire list of words.
        > 3. Custom colors are only available for donations of the $25 USDT tier. Leave Color blank when not using a custom color.

  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > Your transaction will be verified on the blockchain before your submission is approved.
        > Each transaction signature can only be used for one donation submission.
        > If you make multiple donations, please use a separate transaction signature and create a new Issue for each.
