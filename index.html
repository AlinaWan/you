<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>you</title>

    <style>
        :root {
            --bg: #090909;
            --panel: rgba(17, 17, 17, 0.94);
            --panel-hover: #151515;
            --border: rgba(255, 255, 255, 0.09);
            --text: #e5e5e5;
            --muted: #777;
            --dim: #505050;
            --match: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
        }

        body {
            user-select: none;
        }

        canvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;
        }


        /* =========================================================
           SEARCH
        ========================================================= */

        #searchUI {
            position: fixed;

            z-index: 100;

            top: 18px;
            left: 18px;

            width: min(420px, calc(100vw - 36px));

            transform-origin: top left;
        }

        #searchBox {
            background: var(--panel);

            border: 1px solid var(--border);
            border-radius: 11px;

            overflow: hidden;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.38),
                0 2px 10px rgba(0, 0, 0, 0.22);
        }

        #searchInput {
            display: block;

            width: 100%;
            height: 46px;

            padding: 0 15px;

            border: 0;
            outline: none;

            background: transparent;

            color: var(--text);

            font-family: inherit;
            font-size: 14px;
            font-weight: 400;

            user-select: text;
            -webkit-user-select: text;
        }

        #searchInput::placeholder {
            color: #5f5f5f;
        }


        /*
         * The results container always exists, but when empty it
         * smoothly collapses upward.
         */
        #resultsWrapper {
            display: grid;

            grid-template-rows: 0fr;

            opacity: 0;

            transition:
                grid-template-rows 280ms cubic-bezier(.2, .8, .2, 1),
                opacity 180ms ease;
        }

        #resultsWrapper.open {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        #results {
            min-height: 0;
            overflow: hidden;
        }

        #resultsScroll {
            max-height: min(60vh, 500px);
            overflow-y: auto;

            border-top: 1px solid var(--border);

            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }


        /* =========================================================
           SEARCH RESULTS
        ========================================================= */

        .result {
            padding: 11px 15px;

            cursor: pointer;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.035);

            transition:
                background 120ms ease;
        }

        .result:last-child {
            border-bottom: 0;
        }

        .result:hover {
            background: var(--panel-hover);
        }

        .resultWord {
            color: #9b9b9b;

            font-size: 14px;
            line-height: 1.4;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /*
         * Only the matching letters become brighter.
         */
        .resultWord .match {
            color: var(--match);
        }

        /*
         * Duplicate number:
         *
         * blue #2
         */
        .resultNumber {
            display: inline-block;

            margin-left: 5px;

            color: #555;

            font-size: 11px;
            font-style: italic;
            font-weight: 400;
        }


        /* =========================================================
           RESULT DETAILS
        ========================================================= */

        .resultDetails {
            display: grid;

            grid-template-rows: 0fr;

            opacity: 0;

            transition:
                grid-template-rows 200ms ease,
                opacity 160ms ease;

            color: #6e6e6e;

            font-size: 11px;
            line-height: 1.6;
        }

        .result.expanded .resultDetails {
            grid-template-rows: 1fr;
            opacity: 1;

            margin-top: 7px;
        }

        .detailsInner {
            min-height: 0;
            overflow: hidden;
        }

        .detailRow {
            display: flex;
            gap: 10px;
        }

        .detailLabel {
            width: 50px;
            flex-shrink: 0;

            color: #4e4e4e;
        }

        .tag {
            margin-right: 6px;
            color: #777;
        }


        /* =========================================================
           HELP
        ========================================================= */

        #hint {
            position: fixed;

            z-index: 5;

            bottom: 17px;
            left: 50%;

            transform: translateX(-50%);

            color: #3f3f3f;

            font-size: 10px;

            pointer-events: none;

            transition: opacity 300ms ease;
        }


        @media (max-width: 600px) {
            #searchUI {
                top: 10px;
                left: 10px;

                width: calc(100vw - 20px);
            }

            #hint {
                bottom: 10px;
            }
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="searchUI">

    <div id="searchBox">

        <input
            id="searchInput"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Search..."
            aria-label="Search words"
        >

        <div id="resultsWrapper">

            <div id="results">

                <div id="resultsScroll"></div>

            </div>

        </div>

    </div>

</div>


<div id="hint">
    WASD / arrow keys to move
</div>


<script>

/* ================================================================
   CANVAS
================================================================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let dpr =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

function resizeCanvas() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        window.innerWidth * dpr;

    canvas.height =
        window.innerHeight * dpr;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* ================================================================
   CONFIG
================================================================ */

const config = {

    fontSize: 22,

    fontWeight: 600,

    fontFamily:
        "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",

    /*
     * Approximate spacing between words.
     *
     * As more words are added, the occupied world expands.
     */
    spawnDistance: 180,

    /*
     * Spatial hash cell size.
     */
    gridSize: 250,

    /*
     * Words within this distance of the viewport are simulated.
     */
    simulationPadding: 500,

    /*
     * Words within this distance of the viewport are rendered.
     */
    renderPadding: 150,

    currentSpeed: 0.015,

    minSpeed: 0.18,

    friction: 0.985,

    angularFriction: 0.96,

    mouseForce: 1.5,

    mouseRadius: 200,

    panSpeed: 8,

    collisionRestitution: 0.6
};


/* ================================================================
   CAMERA
================================================================ */

const camera = {

    x: 0,
    y: 0

};

function worldToScreen(x, y) {

    return {

        x:
            x -
            camera.x +
            window.innerWidth / 2,

        y:
            y -
            camera.y +
            window.innerHeight / 2

    };
}

function screenToWorld(x, y) {

    return {

        x:
            x +
            camera.x -
            window.innerWidth / 2,

        y:
            y +
            camera.y -
            window.innerHeight / 2

    };
}


/* ================================================================
   KEYBOARD
================================================================ */

/*
 * Keyboard controls are ignored while an input, textarea, or
 * contenteditable element has focus.
 *
 * This means W/A/S/D can be typed normally into the search bar.
 */

const keys =
    new Set();

function isTyping() {

    const active =
        document.activeElement;

    if (!active) {
        return false;
    }

    return (
        active.tagName === "INPUT" ||
        active.tagName === "TEXTAREA" ||
        active.isContentEditable
    );
}

window.addEventListener(
    "keydown",
    event => {

        /*
         * Let the browser/input receive the key normally while
         * typing.
         */
        if (isTyping()) {

            if (event.key === "Escape") {

                searchInput.value = "";

                updateSearch();

                searchInput.blur();

                event.preventDefault();
            }

            return;
        }


        const key =
            event.key.toLowerCase();

        const movementKeys = [

            "w",
            "a",
            "s",
            "d",

            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright"

        ];

        if (
            movementKeys.includes(key)
        ) {

            keys.add(key);

            event.preventDefault();
        }

    }
);

window.addEventListener(
    "keyup",
    event => {

        keys.delete(
            event.key.toLowerCase()
        );

    }
);


function updateCamera() {

    /*
     * Don't move the camera while typing.
     */
    if (isTyping()) {
        return;
    }

    let dx = 0;
    let dy = 0;


    if (
        keys.has("w") ||
        keys.has("arrowup")
    ) {
        dy -= 1;
    }


    if (
        keys.has("s") ||
        keys.has("arrowdown")
    ) {
        dy += 1;
    }


    if (
        keys.has("a") ||
        keys.has("arrowleft")
    ) {
        dx -= 1;
    }


    if (
        keys.has("d") ||
        keys.has("arrowright")
    ) {
        dx += 1;
    }


    if (
        dx !== 0 ||
        dy !== 0
    ) {

        const length =
            Math.hypot(dx, dy);

        dx /= length;
        dy /= length;

        camera.x +=
            dx *
            config.panSpeed;

        camera.y +=
            dy *
            config.panSpeed;
    }
}


/* ================================================================
   MOUSE
================================================================ */

const mouse = {

    x: -10000,
    y: -10000,

    vx: 0,
    vy: 0,

    lastX: -10000,
    lastY: -10000

};

function updateMouse(event) {

    const rect =
        canvas.getBoundingClientRect();

    mouse.x =
        event.clientX -
        rect.left;

    mouse.y =
        event.clientY -
        rect.top;
}

window.addEventListener(
    "mousemove",
    updateMouse
);

window.addEventListener(
    "mouseleave",
    () => {

        mouse.x = -10000;
        mouse.y = -10000;

        mouse.vx = 0;
        mouse.vy = 0;

    }
);


/* ================================================================
   SPATIAL HASH
================================================================ */

class SpatialHash {

    constructor(cellSize) {

        this.cellSize =
            cellSize;

        this.cells =
            new Map();

    }


    cell(value) {

        return Math.floor(
            value /
            this.cellSize
        );

    }


    key(x, y) {

        return `${x},${y}`;

    }


    clear() {

        this.cells.clear();

    }


    insert(object) {

        const minX =
            this.cell(
                object.x -
                object.boundingRadius
            );

        const maxX =
            this.cell(
                object.x +
                object.boundingRadius
            );


        const minY =
            this.cell(
                object.y -
                object.boundingRadius
            );

        const maxY =
            this.cell(
                object.y +
                object.boundingRadius
            );


        for (
            let x = minX;
            x <= maxX;
            x++
        ) {

            for (
                let y = minY;
                y <= maxY;
                y++
            ) {

                const key =
                    this.key(x, y);

                let cell =
                    this.cells.get(key);

                if (!cell) {

                    cell = [];

                    this.cells.set(
                        key,
                        cell
                    );
                }

                cell.push(object);
            }
        }
    }


    getNearby(
        x,
        y,
        radius = 1
    ) {

        const cx =
            this.cell(x);

        const cy =
            this.cell(y);

        const found =
            new Set();


        for (
            let gx = cx - radius;
            gx <= cx + radius;
            gx++
        ) {

            for (
                let gy = cy - radius;
                gy <= cy + radius;
                gy++
            ) {

                const cell =
                    this.cells.get(
                        this.key(
                            gx,
                            gy
                        )
                    );

                if (!cell) {
                    continue;
                }

                for (
                    const object of cell
                ) {

                    found.add(object);

                }
            }
        }

        return found;
    }


    getRect(
        minX,
        minY,
        maxX,
        maxY
    ) {

        const startX =
            this.cell(minX);

        const endX =
            this.cell(maxX);

        const startY =
            this.cell(minY);

        const endY =
            this.cell(maxY);


        const found =
            new Set();


        for (
            let x = startX;
            x <= endX;
            x++
        ) {

            for (
                let y = startY;
                y <= endY;
                y++
            ) {

                const cell =
                    this.cells.get(
                        this.key(x, y)
                    );

                if (!cell) {
                    continue;
                }

                for (
                    const object of cell
                ) {

                    found.add(object);

                }
            }
        }

        return found;
    }
}


const spatialHash =
    new SpatialHash(
        config.gridSize
    );


/* ================================================================
   WORD DATA
================================================================ */

async function loadWordsFromRepository() {

    const response =
        await fetch("./words.txt", {
            cache: "no-store"
        });

    if (!response.ok) {

        throw new Error(
            `Could not load words.txt: HTTP ${response.status}`
        );

    }


    const text =
        await response.text();


    wordData =
        text
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(Boolean)
            .map(line => {

                const parts =
                    line.split("\t");


                return {

                    word:
                        (parts[0] || "")
                            .trim(),

                    date:
                        (parts[1] || "")
                            .trim(),

                    tags:
                        (parts[2] || "")
                            .split(",")
                            .map(tag =>
                                tag.trim()
                            )
                            .filter(Boolean),

                    description:
                        (parts[3] || "")
                            .trim()

                };

            })
            .filter(
                item =>
                    item.word.length > 0
            );
}


/* ================================================================
   WORD OBJECT
================================================================ */

let wordObjects = [];

let time = 0;


function measureWord(text) {

    ctx.font =
        `${config.fontWeight} ${config.fontSize}px ${config.fontFamily}`;

    const metrics =
        ctx.measureText(text);

    return {

        width:
            metrics.width + 16,

        height:
            config.fontSize * 1.1

    };
}


class Word {

    constructor(data, index) {

        this.data =
            data;

        this.text =
            data.word;

        this.index =
            index;


        const dimensions =
            measureWord(
                this.text
            );

        this.width =
            dimensions.width;

        this.height =
            dimensions.height;


        this.boundingRadius =
            Math.hypot(
                this.width,
                this.height
            ) / 2;


        /*
         * Golden-angle distribution.
         *
         * This produces a pleasant, gradually expanding field.
         */
        const angle =
            index *
            2.3999632297;

        const radius =
            Math.sqrt(
                index + 1
            ) *
            config.spawnDistance;


        this.x =
            Math.cos(angle) *
            radius +
            (Math.random() - 0.5) *
            50;

        this.y =
            Math.sin(angle) *
            radius +
            (Math.random() - 0.5) *
            50;


        /*
         * Initial movement.
         */
        const direction =
            Math.random() *
            Math.PI *
            2;

        const speed =
            config.minSpeed +
            Math.random() *
            0.3;


        this.vx =
            Math.cos(direction) *
            speed;

        this.vy =
            Math.sin(direction) *
            speed;


        this.angle =
            (Math.random() - 0.5) *
            0.35;

        this.angularVelocity =
            (Math.random() - 0.5) *
            0.015;


        this.mass =
            Math.max(
                1,
                (
                    this.width *
                    this.height
                ) / 1000
            );


        this.inertia =
            (1 / 12) *
            this.mass *
            (
                this.width *
                this.width +
                this.height *
                this.height
            );


        this.floatOffset =
            Math.random() *
            Math.PI *
            2;

        this.floatFrequency =
            0.7 +
            Math.random() *
            0.5;
    }


    update() {

        /*
         * Gentle current.
         */
        const currentAngle =
            Math.sin(
                this.x *
                0.0015 +
                time *
                0.4
            ) *
            Math.cos(
                this.y *
                0.0015 +
                time *
                0.3
            ) *
            Math.PI *
            2;


        this.vx +=
            Math.cos(
                currentAngle
            ) *
            config.currentSpeed;


        this.vy +=
            Math.sin(
                currentAngle
            ) *
            config.currentSpeed;


        /*
         * Mouse force.
         */
        if (
            mouse.x > -1000
        ) {

            const mouseWorld =
                screenToWorld(
                    mouse.x,
                    mouse.y
                );


            const dx =
                this.x -
                mouseWorld.x;

            const dy =
                this.y -
                mouseWorld.y;


            const distanceSq =
                dx * dx +
                dy * dy;


            const radiusSq =
                config.mouseRadius *
                config.mouseRadius;


            if (
                distanceSq <
                radiusSq &&
                distanceSq > 0
            ) {

                const distance =
                    Math.sqrt(
                        distanceSq
                    );


                const nx =
                    dx / distance;

                const ny =
                    dy / distance;


                const factor =
                    Math.pow(
                        1 -
                        distance /
                        config.mouseRadius,
                        2
                    );


                const push =
                    factor *
                    config.mouseForce *
                    1.2;


                const dragX =
                    mouse.vx *
                    factor *
                    0.2;

                const dragY =
                    mouse.vy *
                    factor *
                    0.2;


                this.vx +=
                    (
                        nx * push +
                        dragX
                    ) /
                    this.mass;


                this.vy +=
                    (
                        ny * push +
                        dragY
                    ) /
                    this.mass;


                const torque =
                    (
                        dragX * -ny +
                        dragY * nx
                    ) *
                    this.width *
                    0.02;


                this.angularVelocity +=
                    torque /
                    this.inertia;
            }
        }


        /*
         * Drag.
         */
        this.vx *=
            config.friction;

        this.vy *=
            config.friction;

        this.angularVelocity *=
            config.angularFriction;


        /*
         * Minimum speed.
         */
        const speed =
            Math.hypot(
                this.vx,
                this.vy
            );


        if (
            speed <
            config.minSpeed
        ) {

            if (
                speed === 0
            ) {

                const a =
                    Math.random() *
                    Math.PI *
                    2;

                this.vx =
                    Math.cos(a) *
                    config.minSpeed;

                this.vy =
                    Math.sin(a) *
                    config.minSpeed;

            } else {

                const scale =
                    config.minSpeed /
                    speed;

                this.vx *=
                    scale;

                this.vy *=
                    scale;
            }
        }


        /*
         * Integrate.
         */
        this.x +=
            this.vx;

        this.y +=
            this.vy;

        this.angle +=
            this.angularVelocity;
    }


    draw() {

        const screen =
            worldToScreen(
                this.x,
                this.y
            );


        /*
         * Final render culling.
         */
        if (

            screen.x <
                -config.renderPadding -
                this.width ||

            screen.x >
                window.innerWidth +
                config.renderPadding +
                this.width ||

            screen.y <
                -config.renderPadding -
                this.height ||

            screen.y >
                window.innerHeight +
                config.renderPadding +
                this.height

        ) {

            return;
        }


        ctx.save();


        ctx.translate(
            screen.x,
            screen.y
        );


        ctx.rotate(
            this.angle
        );


        const floatY =
            Math.sin(
                time *
                this.floatFrequency +
                this.floatOffset
            ) * 2;


        ctx.font =
            `${config.fontWeight} ${config.fontSize}px ${config.fontFamily}`;


        ctx.fillStyle =
            "rgba(235, 235, 235, 0.94)";


        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        ctx.fillText(
            this.text,
            0,
            floatY
        );


        ctx.restore();
    }
}


/* ================================================================
   SPATIAL HASH / VISIBILITY
================================================================ */

function rebuildSpatialHash() {

    spatialHash.clear();

    for (
        const word of wordObjects
    ) {

        spatialHash.insert(
            word
        );

    }
}


function getVisibleObjects(
    padding
) {

    const halfWidth =
        window.innerWidth / 2;

    const halfHeight =
        window.innerHeight / 2;


    return spatialHash.getRect(

        camera.x -
            halfWidth -
            padding,

        camera.y -
            halfHeight -
            padding,

        camera.x +
            halfWidth +
            padding,

        camera.y +
            halfHeight +
            padding

    );
}


/* ================================================================
   COLLISIONS
================================================================ */

function checkCollision(a, b) {

    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;


    const radius =
        a.boundingRadius +
        b.boundingRadius;


    const distanceSq =
        dx * dx +
        dy * dy;


    if (
        distanceSq >
        radius * radius
    ) {

        return null;
    }


    const distance =
        Math.sqrt(
            distanceSq
        ) || 0.001;


    return {

        depth:
            radius -
            distance,

        nx:
            dx / distance,

        ny:
            dy / distance

    };
}


function handleCollisions() {

    const objects =
        getVisibleObjects(
            config.simulationPadding
        );


    const processed =
        new Set();


    for (
        const a of objects
    ) {

        const nearby =
            spatialHash.getNearby(
                a.x,
                a.y,
                1
            );


        for (
            const b of nearby
        ) {

            if (
                a === b
            ) {
                continue;
            }


            const pairKey =
                a.index <
                b.index

                    ? `${a.index}:${b.index}`

                    : `${b.index}:${a.index}`;


            if (
                processed.has(
                    pairKey
                )
            ) {
                continue;
            }


            processed.add(
                pairKey
            );


            const collision =
                checkCollision(
                    a,
                    b
                );


            if (!collision) {
                continue;
            }


            const {
                depth,
                nx,
                ny
            } = collision;


            const totalMass =
                a.mass +
                b.mass;


            /*
             * Separate.
             */
            a.x -=
                nx *
                depth *
                (b.mass /
                    totalMass);

            a.y -=
                ny *
                depth *
                (b.mass /
                    totalMass);


            b.x +=
                nx *
                depth *
                (a.mass /
                    totalMass);

            b.y +=
                ny *
                depth *
                (a.mass /
                    totalMass);


            /*
             * Relative velocity.
             */
            const rvx =
                b.vx -
                a.vx;

            const rvy =
                b.vy -
                a.vy;


            const velocityAlongNormal =
                rvx * nx +
                rvy * ny;


            if (
                velocityAlongNormal <
                0
            ) {

                const impulse =
                    -(
                        1 +
                        config.collisionRestitution
                    ) *
                    velocityAlongNormal /
                    (
                        1 / a.mass +
                        1 / b.mass
                    );


                a.vx -=
                    (
                        impulse /
                        a.mass
                    ) *
                    nx;

                a.vy -=
                    (
                        impulse /
                        a.mass
                    ) *
                    ny;


                b.vx +=
                    (
                        impulse /
                        b.mass
                    ) *
                    nx;

                b.vy +=
                    (
                        impulse /
                        b.mass
                    ) *
                    ny;
            }
        }
    }
}


/* ================================================================
   SEARCH
================================================================ */

const searchInput =
    document.getElementById(
        "searchInput"
    );

const resultsWrapper =
    document.getElementById(
        "resultsWrapper"
    );

const resultsScroll =
    document.getElementById(
        "resultsScroll"
    );


function normalize(value) {

    return value
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );
}


function escapeHTML(value) {

    return value
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/*
 * Search ranking.
 *
 * Lower score = more relevant.
 *
 * exact
 * ↓
 * starts with query
 * ↓
 * contains query
 * ↓
 * tag match
 * ↓
 * description match
 */
function searchScore(
    item,
    query
) {

    const word =
        normalize(
            item.word
        );


    if (
        word === query
    ) {

        return 0;
    }


    if (
        word.startsWith(
            query
        )
    ) {

        return (
            10 +
            word.length
        );
    }


    const wordIndex =
        word.indexOf(
            query
        );


    if (
        wordIndex !== -1
    ) {

        return (
            100 +
            wordIndex * 10 +
            word.length
        );
    }


    const tags =
        item.tags
            .map(normalize)
            .join(" ");


    if (
        tags.includes(
            query
        )
    ) {

        return (
            500 +
            tags.length
        );
    }


    const description =
        normalize(
            item.description
        );


    if (
        description.includes(
            query
        )
    ) {

        return (
            1000 +
            description.length
        );
    }


    return Infinity;
}


/*
 * Highlight only the matching letters.
 */
function highlightMatch(
    text,
    query
) {

    if (!query) {

        return escapeHTML(
            text
        );
    }


    const normalized =
        normalize(
            text
        );


    const index =
        normalized.indexOf(
            query
        );


    if (
        index === -1
    ) {

        return escapeHTML(
            text
        );
    }


    return (

        escapeHTML(
            text.slice(
                0,
                index
            )
        )

        +

        `<span class="match">`

        +

        escapeHTML(
            text.slice(
                index,
                index +
                    query.length
            )
        )

        +

        `</span>`

        +

        escapeHTML(
            text.slice(
                index +
                    query.length
            )
        )

    );
}


/*
 * Give duplicate words a number.
 */
function getDuplicateNumber(
    result,
    allResults
) {

    const duplicates =
        allResults.filter(
            other =>
                normalize(
                    other.item.word
                ) ===
                normalize(
                    result.item.word
                )
        );


    if (
        duplicates.length <= 1
    ) {

        return "";
    }


    const position =
        duplicates.findIndex(
            other =>
                other.index ===
                result.index
        ) + 1;


    return `
        <span class="resultNumber">
            #${position}
        </span>
    `;
}


/*
 * Render search results.
 */
function updateSearch() {

    const raw =
        searchInput.value.trim();


    const query =
        normalize(raw);


    /*
     * Empty search = smoothly minimize.
     */
    if (!query) {

        resultsWrapper.classList.remove(
            "open"
        );

        resultsScroll.innerHTML = "";

        return;
    }


    const matches =
        wordData
            .map(
                (item, index) => ({

                    item,

                    index,

                    score:
                        searchScore(
                            item,
                            query
                        )

                })
            )
            .filter(
                result =>
                    result.score !==
                    Infinity
            )
            .sort(
                (a, b) => {

                    if (
                        a.score !==
                        b.score
                    ) {

                        return (
                            a.score -
                            b.score
                        );
                    }


                    return (
                        a.item.word.length -
                        b.item.word.length
                    );
                }
            );


    /*
     * Open BEFORE putting results in.
     *
     * This makes typing the first letter trigger the animation
     * immediately.
     */
    resultsWrapper.classList.add(
        "open"
    );


    if (
        matches.length === 0
    ) {

        resultsScroll.innerHTML = `
            <div
                style="
                    padding: 14px 15px;
                    color: #555;
                    font-size: 12px;
                "
            >
                No matches
            </div>
        `;

        return;
    }


    resultsScroll.innerHTML =
        matches
            .map(
                (result, resultIndex) => {

                    const item =
                        result.item;


                    const duplicate =
                        getDuplicateNumber(
                            result,
                            matches
                        );


                    return `

                        <div
                            class="result"
                            data-index="${result.index}"
                        >

                            <div class="resultWord">

                                ${highlightMatch(
                                    item.word,
                                    query
                                )}

                                ${duplicate}

                            </div>


                            <div class="resultDetails">

                                <div class="detailsInner">

                                    ${
                                        item.date
                                            ? `

                                        <div class="detailRow">

                                            <span class="detailLabel">
                                                date
                                            </span>

                                            <span>
                                                ${escapeHTML(
                                                    item.date
                                                )}
                                            </span>

                                        </div>

                                        `
                                            : ""
                                    }


                                    ${
                                        item.tags &&
                                        item.tags.length
                                            ? `

                                        <div class="detailRow">

                                            <span class="detailLabel">
                                                tags
                                            </span>

                                            <span>

                                                ${item.tags
                                                    .map(
                                                        tag =>
                                                            `<span class="tag">#${escapeHTML(tag)}</span>`
                                                    )
                                                    .join("")}

                                            </span>

                                        </div>

                                        `
                                            : ""
                                    }


                                    ${
                                        item.description
                                            ? `

                                        <div class="detailRow">

                                            <span class="detailLabel">
                                                note
                                            </span>

                                            <span>
                                                ${escapeHTML(
                                                    item.description
                                                )}
                                            </span>

                                        </div>

                                        `
                                            : ""
                                    }

                                </div>

                            </div>

                        </div>

                    `;
                }
            )
            .join("");
}


/*
 * THIS is the important part:
 *
 * input event fires for every character typed, including W/A/S/D.
 */
searchInput.addEventListener(
    "input",
    updateSearch
);


/*
 * Click result.
 *
 * Clicking the word expands its details and jumps the camera
 * to the corresponding word.
 */
resultsScroll.addEventListener(
    "click",
    event => {

        const result =
            event.target.closest(
                ".result"
            );


        if (!result) {
            return;
        }


        const index =
            Number(
                result.dataset.index
            );


        const word =
            wordObjects[index];


        if (!word) {
            return;
        }


        /*
         * Expand/collapse details.
         */
        result.classList.toggle(
            "expanded"
        );


        /*
         * Jump camera to word.
         */
        camera.x =
            word.x;

        camera.y =
            word.y;

    }
);


/* ================================================================
   WORD INITIALIZATION
================================================================ */

function initWordObjects() {

    wordObjects = [];


    for (
        let i = 0;
        i < wordData.length;
        i++
    ) {

        wordObjects.push(
            new Word(
                wordData[i],
                i
            )
        );

    }


    rebuildSpatialHash();
}


/* ================================================================
   BACKGROUND
================================================================ */

function drawBackground() {

    ctx.fillStyle =
        "#090909";

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );
}


/* ================================================================
   ANIMATION
================================================================ */

let lastTimestamp =
    performance.now();


function animate(
    timestamp
) {

    const delta =
        Math.min(
            (
                timestamp -
                lastTimestamp
            ) / 1000,
            0.05
        );


    lastTimestamp =
        timestamp;


    time +=
        delta;


    /*
     * Camera.
     */
    updateCamera();


    /*
     * Mouse velocity.
     */
    if (
        mouse.lastX > -1000
    ) {

        mouse.vx =
            (
                mouse.x -
                mouse.lastX
            ) *
            0.4;


        mouse.vy =
            (
                mouse.y -
                mouse.lastY
            ) *
            0.4;
    }


    mouse.lastX =
        mouse.x;

    mouse.lastY =
        mouse.y;


    mouse.vx *=
        0.8;

    mouse.vy *=
        0.8;


    /*
     * Build spatial hash.
     */
    rebuildSpatialHash();


    /*
     * Only simulate nearby words.
     */
    const simulation =
        getVisibleObjects(
            config.simulationPadding
        );


    for (
        const word of simulation
    ) {

        word.update();

    }


    /*
     * Words have moved, so update their cells.
     */
    rebuildSpatialHash();


    /*
     * Collision detection is restricted to neighboring cells.
     */
    handleCollisions();


    /*
     * Draw only visible cells/objects.
     */
    const visible =
        getVisibleObjects(
            config.renderPadding
        );


    drawBackground();


    for (
        const word of visible
    ) {

        word.draw();

    }


    requestAnimationFrame(
        animate
    );
}


/* ================================================================
   START
================================================================ */

async function start() {

    await loadWordsFromRepository();

    initWordObjects();

    requestAnimationFrame(
        animate
    );

}

start();

</script>
