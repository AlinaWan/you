<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>you</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<canvas id="canvas"></canvas>

<div id="searchUI">

    <div id="searchBox">

        <input
            id="searchInput"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Search..."
            aria-label="Search words"
        >

        <div id="resultsWrapper">

            <div id="results">

                <div id="resultsScroll"></div>

            </div>

        </div>

    </div>

</div>


<div id="hint">
    <span class="desktopHint">WASD / arrow keys to move</span>
    <span class="mobileHint">1 finger to explore · 2 fingers to pan</span>
</div>

<script type="module" src="./js/main.js"></script>

</body>
</html>
